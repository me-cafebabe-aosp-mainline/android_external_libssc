syntax = "proto2";
package ssc.sensor.proxy;

/*
 * Each message specifies a message type to indicate the
 * purpose of the message such as controlling a sensor,
 * delivering sensor data, etc.
 */
enum SscSharedMsgType {
	SSC_MSG_REQUEST_ATTRIBUTE = 1;
	SSC_MSG_REQUEST_FLUSH = 2;
	SSC_MSG_EVENT_ATTRIBUTE = 128;
	SSC_MSG_EVENT_FLUSH = 129;
	SSC_MSG_EVENT_ERROR = 130;
        SSC_MSG_REQUEST_SUID_SENSOR = 512;
        SSC_MSG_EVENT_SUID_SENSOR = 768;
}

/* Specifies where the sensor client resides. */
enum SscSharedProcessorType {
	SSC_PROCESSOR_SSC = 0;
	SSC_PROCESSOR_APSS = 1;
	SSC_PROCESSOR_ADSP = 2;
	SSC_PROCESSOR_MDSP = 3;
	SSC_PROCESSOR_CDSP = 4;
}

/* Possible error types generated by the SSC for clients. */
enum SscSharedErrorType {
	SSC_ERROR_SUCCESS = 0;
	SSC_ERROR_FAILED = 1;
	SSC_ERROR_UNSUPPORTED = 2;
	SSC_ERROR_INVALID_TYPE = 3;
	SSC_ERROR_CRITICAL = 4;
	SSC_ERROR_INVALID_ARGUMENTS = 5;
	SSC_ERROR_UNAVAILABLE = 6;
	SSC_ERROR_REJECTED = 7;
}

/* 
 * Specifies if the SSC should wakeup the processor on
 * which the sensor client resides when new data is available.
 */
enum SscSharedSuspendType {
	WAKEUP = 0;
	NO_WAKEUP = 1;
}

/*
 * Each message has a sensor UID to specify which sensor 
 * should receive the message. UIDs are 128bit, but ProtoBuf 
 * is limited to 64bit values, thus they are split into uid_low
 * and uid_high.
 */
message SscSharedUid {
	required fixed64 uid_low = 1;
	required fixed64 uid_high = 2;
}

/* 
 * Client configuration 
 * @processor: a value from the SscSharedProcessorType enum. Default APPS.
 * @suspend_mode: a value from the SscSharedSuspendType enum. Default WAKEUP.
 * @no_wakeup_msg_ids: list of messages that do not cause a wakeup.
 */
message SscSharedConfig {
        required SscSharedProcessorType processor = 1 [default = SSC_PROCESSOR_APSS];
        required SscSharedSuspendType suspend_mode = 2 [default = WAKEUP]; 
        repeated fixed32 no_wakeup_msg_ids = 3;
}

/*
 * Error generating by the SSC are reported as an event.
 */
message SscSharedError {
	required SscSharedErrorType error = 1;
}
